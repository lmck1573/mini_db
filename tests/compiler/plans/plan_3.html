<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3. 交叉连接（逗号写法）</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --text: #1f2733;
    --muted: #6b7280;
    --line: #e3e7ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1c2027;
      --text: #eef1f6;
      --muted: #9aa4b2;
      --line: #2b313a;
    }
    .canvas { background: #22262e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 24px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
                 "PingFang SC", sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 6px; }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .sub pre {
    margin: 8px 0 0; padding: 10px 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-all;
  }
  .canvas {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; overflow-x: auto;
  }
  .canvas svg { display: block; margin: 0 auto; }
  .legend { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid; font-weight: 600;
  }
  .node { cursor: default; }
  .node rect { transition: filter .15s ease; }
  .node:hover rect { filter: drop-shadow(0 3px 8px rgba(0,0,0,.18)); }
  footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>3. 交叉连接（逗号写法）</h1>
<div class="sub">
  生成的计划树（自顶向下阅读，根节点在最上方）。悬停任意节点可查看其 JSON 结构。
  <pre>SELECT student.name, score.course FROM student, score WHERE student.id = score.sid;</pre>
</div>
<div class="canvas">

<path d="M 354.6 177.0 V 198.0 H 269.8 V 219.0" fill="none" stroke="#c2c9d6" stroke-width="1.6"/>
<path d="M 269.8 281.0 V 302.0 H 111.0 V 323.0" fill="none" stroke="#c2c9d6" stroke-width="1.6"/>
<path d="M 269.8 281.0 V 302.0 H 433.6 V 323.0" fill="none" stroke="#c2c9d6" stroke-width="1.6"/>
<g class="node">

<rect x="203.8" y="11.0" width="225.6" height="62" rx="9" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="316.6" y="33.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1b7a44">Project</text>
<text x="316.6" y="51.0" text-anchor="middle" font-size="11.5" fill="#4a5568">student.name, score.course</text>
</g>
<g class="node">
<title>{&quot;op&quot;: &quot;Filter&quot;, &quot;predicate&quot;: {&quot;type&quot;: &quot;BinaryOp&quot;, &quot;op&quot;: &quot;=&quot;, &quot;left&quot;: {&quot;type&quot;: &quot;ColumnRef&quot;, &quot;name&quot;: &quot;id&quot;, &quot;table&quot;: &quot;student&quot;}, &quot;right&quot;: {&quot;type&quot;: &quot;ColumnRef&quot;, &quot;name&quot;: &quot;sid&quot;, &quot;table&quot;: &quot;score&quot;}}, &quot;child&quot;: {&quot;op&quot;: &quot;Join&quot;, &quot;join_type&quot;: &quot;CROSS&quot;, &quot;on&quot;: null, &quot;right_columns&quot;: [&quot;score.sid&quot;, &quot;score.course&quot;, &quot;score.score&quot;], &quot;left&quot;: {&quot;op&quot;: &quot;SeqScan&quot;, &quot;table_name&quot;: &quot;student&quot;, &quot;source&quot;: &quot;student&quot;}, &quot;right&quot;: {&quot;op&quot;: &quot;SeqScan&quot;, &quot;table_name&quot;: &quot;score&quot;, &quot;source&quot;: &quot;score&quot;}}}</title>
<rect x="203.8" y="115.0" width="301.6" height="62" rx="9" fill="#fff2e3" stroke="#f2994a" stroke-width="1.8"/>
<text x="354.6" y="137.0" text-anchor="middle" font-size="14" font-weight="700" fill="#b8600f">Filter</text>
<text x="354.6" y="155.0" text-anchor="middle" font-size="11.5" fill="#4a5568">predicate = (student.id = sco…</text>
</g>
<g class="node">
<title>{&quot;op&quot;: &quot;Join&quot;, &quot;join_type&quot;: &quot;CROSS&quot;, &quot;on&quot;: null, &quot;right_columns&quot;: [&quot;score.sid&quot;, &quot;score.course&quot;, &quot;score.score&quot;], &quot;left&quot;: {&quot;op&quot;: &quot;SeqScan&quot;, &quot;table_name&quot;: &quot;student&quot;, &quot;source&quot;: &quot;student&quot;}, &quot;right&quot;: {&quot;op&quot;: &quot;SeqScan&quot;, &quot;table_name&quot;: &quot;score&quot;, &quot;source&quot;: &quot;score&quot;}}</title>
<rect x="203.8" y="219.0" width="132.0" height="62" rx="9" fill="#ffe9e9" stroke="#eb5757" stroke-width="1.8"/>
<text x="269.8" y="241.0" text-anchor="middle" font-size="14" font-weight="700" fill="#b32b2b">Join CROSS</text>
<text x="269.8" y="259.0" text-anchor="middle" font-size="11.5" fill="#4a5568">nested-loop</text>
</g>
<g class="node">
<title>{&quot;op&quot;: &quot;SeqScan&quot;, &quot;table_name&quot;: &quot;student&quot;, &quot;source&quot;: &quot;student&quot;}</title>
<rect x="40.0" y="323.0" width="142.0" height="62" rx="9" fill="#e6f0ff" stroke="#2f80ed" stroke-width="1.8"/>
<text x="111.0" y="345.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1a5fb4">SeqScan</text>
<text x="111.0" y="363.0" text-anchor="middle" font-size="11.5" fill="#4a5568">table = student</text>
<text x="111.0" y="378.0" text-anchor="middle" font-size="11.5" fill="#4a5568">as student</text>
</g>
<g class="node">
<title>{&quot;op&quot;: &quot;SeqScan&quot;, &quot;table_name&quot;: &quot;score&quot;, &quot;source&quot;: &quot;score&quot;}</title>
<rect x="367.6" y="323.0" width="132.0" height="62" rx="9" fill="#e6f0ff" stroke="#2f80ed" stroke-width="1.8"/>
<text x="433.6" y="345.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1a5fb4">SeqScan</text>
<text x="433.6" y="363.0" text-anchor="middle" font-size="11.5" fill="#4a5568">table = score</text>
<text x="433.6" y="378.0" text-anchor="middle" font-size="11.5" fill="#4a5568">as score</text>

</svg>
</div>
<div class="legend"><span class="chip" style="background:#eeeaff;border-color:#7c6cf0;color:#4a3fbf">DDL/DML</span><span class="chip" style="background:#e6f0ff;border-color:#2f80ed;color:#1a5fb4">顺序扫描</span><span class="chip" style="background:#fff2e3;border-color:#f2994a;color:#b8600f">过滤</span><span class="chip" style="background:#e6f7ee;border-color:#27ae60;color:#1b7a44">投影</span><span class="chip" style="background:#ffe9e9;border-color:#eb5757;color:#b32b2b">连接</span><span class="chip" style="background:#e0f7f7;border-color:#00a3a3;color:#017070">聚合</span><span class="chip" style="background:#eef2f7;border-color:#6b7a90;color:#44546a">排序</span></div>
<footer>Mini-DB · 模块一 SQL 编译器 · 计划可视化</footer>
</body>
</html>
